name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'

            docker pull ghcr.io/zouaouiiheb1996/book-recommender:latest

            docker stop book-recommender || true
            docker rm book-recommender || true

            docker run -d \
              --name book-recommender \
              --restart unless-stopped \
              --env-file /home/ssm-user/book-recommender.env \
              -p 7860:7860 \
              ghcr.io/zouaouiiheb1996/book-recommender:latest

            sleep 15

            curl -f http://localhost:7860/

          EOF